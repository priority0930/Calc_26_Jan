<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>승규 ❤ 수진 운동일지</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B9%3C/text%3E%3C/svg%3E">
<style>
:root{
  --cream:#fff8ec;
  --pink-bg:#ffeef2;
  --ink:#5b4636;
  --ink-soft:#8a7461;
  --hamrang:#eccb98;
  --hamrang-dark:#c9a46b;
  --hamrang-collar:#ffd35c;
  --hamrang-collar-dark:#f3b62e;
  --chorong:#fffdf9;
  --chorong-shade:#efe7da;
  --chorong-pink:#ffb3c7;
  --chorong-pink-dark:#ff8aa8;
  --belly:#fff6e6;
  --cheek:#ffb3ac;
  --circle:#5cb87a;
  --triangle:#f0a93d;
  --cross:#e2665f;
  --card-radius:26px;
  --shadow: 0 8px 24px rgba(150, 110, 70, 0.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 10%, rgba(255,220,180,0.35) 0, transparent 45%),
    radial-gradient(circle at 90% 20%, rgba(255,190,210,0.35) 0, transparent 45%),
    linear-gradient(160deg, var(--cream) 0%, var(--pink-bg) 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:100px;
  overflow-x:hidden;
}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px;}

/* ---------- Header ---------- */
.app-header{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:18px 10px 8px;text-align:center;flex-wrap:wrap;
}
.app-header h1{
  font-size:clamp(20px,4vw,28px);
  margin:0;
  letter-spacing:-0.5px;
}
.app-header .heart{color:var(--chorong-pink-dark);}
.mascot-mini{width:52px;height:52px;flex:0 0 auto;}
.app-sub{
  text-align:center;color:var(--ink-soft);font-size:13px;margin-top:2px;margin-bottom:18px;
}

/* ---------- Week Nav ---------- */
.week-nav{
  display:flex;align-items:center;justify-content:center;gap:14px;
  background:#fff;border-radius:999px;box-shadow:var(--shadow);
  padding:8px 18px;max-width:420px;margin:0 auto 12px;
}
.week-nav button{
  border:none;background:var(--pink-bg);color:var(--ink);
  width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.week-nav button:hover{background:var(--chorong-pink);color:#fff;}
.week-nav .label{font-weight:700;font-size:13px;min-width:190px;text-align:center;}

.today-wrap{display:flex;justify-content:center;gap:8px;margin-bottom:16px;}
.today-btn{
  font-size:11px;border-radius:999px;padding:5px 12px;
  background:var(--hamrang-collar);color:var(--ink);font-weight:700;border:none;cursor:pointer;
}
.today-btn:hover{background:var(--hamrang-collar-dark);}

.identity-chip{
  display:block;margin:2px auto 14px;font-size:12px;font-weight:700;
  padding:6px 14px;border-radius:999px;background:#fff;color:var(--ink);border:none;
  box-shadow:var(--shadow);cursor:pointer;
}
.identity-chip:hover{background:var(--pink-bg);}

.view-badge{
  display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;
  padding:2px 8px;border-radius:999px;background:#f1ede3;color:var(--ink-soft);vertical-align:middle;
}

button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.35);}
input:disabled{opacity:.5;}
textarea[readonly]{background:#f7f4ee;color:var(--ink-soft);}

.identity-pick-row{display:flex;gap:16px;padding:20px;}
.identity-pick-btn{
  flex:1;border:2px solid #f1ede3;background:#fffaf0;border-radius:20px;padding:18px 10px;
  text-align:center;cursor:pointer;transition:.15s;
}
.identity-pick-btn:hover{transform:translateY(-2px);border-color:var(--chorong-pink-dark);}
.identity-pick-btn svg{width:72px;height:72px;}
.identity-pick-btn .ipb-name{font-weight:800;font-size:15px;margin-top:8px;}

.comments-block{margin-top:16px;border-top:2px dashed #f1ede3;padding-top:12px;}
.comment-item{background:#fbf8f2;border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.5;}
.comment-item .c-author{font-weight:800;margin-right:6px;}
.comment-item .c-time{color:#bcae9b;font-size:10.5px;margin-left:8px;}
.comment-add-row{display:flex;gap:6px;margin-top:6px;}
.comment-add-row input{flex:1;border-radius:10px;border:2px solid #f1ede3;padding:7px 10px;font-size:13px;font-family:inherit;}
.comment-add-row button{border:none;border-radius:10px;padding:0 14px;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;}
.hamrang-theme .comment-add-row button{background:var(--hamrang-dark);}
.chorong-theme .comment-add-row button{background:var(--chorong-pink-dark);}

/* ---------- Day Tabs ---------- */
.day-tabs{
  display:grid;grid-template-columns:repeat(7,1fr);gap:8px;
  max-width:720px;margin:0 auto 22px;
}
.day-tab{
  background:#fff;border:2px solid transparent;border-radius:16px;
  padding:8px 4px 6px;text-align:center;cursor:pointer;box-shadow:var(--shadow);
  transition:.15s;
}
.day-tab:hover{transform:translateY(-2px);}
.day-tab.active{border-color:var(--chorong-pink-dark);background:#fff2f6;}
.day-tab .dname{font-weight:800;font-size:14px;}
.day-tab.sun .dname{color:#e2665f;}
.day-tab.sat .dname{color:#4a7fd6;}
.day-tab .dsub{font-size:10px;color:#bcae9b;}
.day-tab .dots{display:flex;justify-content:center;gap:4px;margin-top:5px;}
.day-tab .dot{width:9px;height:9px;border-radius:50%;background:#e7e0d6;}
.day-tab .dot.done-circle{background:var(--circle);}
.day-tab .dot.done-x{background:var(--cross);}
.day-tab .dot.progress{background:var(--triangle);}

/* ---------- User Cards ---------- */
.cards{
  display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;
}
@media (max-width:760px){ .cards{grid-template-columns:1fr;} }

.card{
  background:#fff;border-radius:var(--card-radius);box-shadow:var(--shadow);
  padding:20px 20px 24px;position:relative;overflow:hidden;
}
.card.hamrang-theme{box-shadow:0 8px 24px rgba(201,164,107,0.20);}
.card.chorong-theme{box-shadow:0 8px 24px rgba(255,138,168,0.20);}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.card-head .mascot-avatar{width:56px;height:56px;flex:0 0 auto;}
.card-head .who{flex:1;}
.card-head .who .name{font-size:18px;font-weight:800;}
.card-head .who .badge{
  display:inline-block;margin-top:2px;font-size:12px;font-weight:700;
  padding:2px 10px;border-radius:999px;background:#f1ede3;color:var(--ink-soft);
}
.card-head .progress-ring{font-size:11px;color:var(--ink-soft);text-align:right;}

.step{margin-top:16px;}
.step-label{
  font-size:12px;font-weight:800;color:#fff;display:inline-flex;align-items:center;gap:5px;
  background:var(--ink);opacity:.78;padding:3px 10px;border-radius:999px;margin-bottom:8px;
}
.hamrang-theme .step-label{background:var(--hamrang-dark);opacity:1;}
.chorong-theme .step-label{background:var(--chorong-pink-dark);opacity:1;}

.type-toggle{display:flex;gap:10px;}
.type-btn{
  flex:1;padding:12px 8px;border-radius:16px;border:2px solid #eee2cf;background:#fffaf0;
  cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-soft);transition:.15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.type-btn:hover{transform:translateY(-1px);}
.type-btn.selected{
  background:linear-gradient(135deg,var(--hamrang-collar),var(--hamrang));
  border-color:var(--hamrang-dark);color:var(--ink);box-shadow:0 4px 10px rgba(201,164,107,.35);
}
.chorong-theme .type-btn.selected{
  background:linear-gradient(135deg,#ffd6e2,var(--chorong-pink));
  border-color:var(--chorong-pink-dark);box-shadow:0 4px 10px rgba(255,138,168,.35);
}

textarea.plan-input{
  width:100%;min-height:88px;border-radius:14px;border:2px solid #f1ede3;
  padding:10px 12px;font-size:13.5px;font-family:inherit;resize:vertical;color:var(--ink);
  background:#fffdf8;
}
textarea.plan-input:focus{outline:none;border-color:var(--chorong-pink-dark);}

.split-btn{
  margin-top:8px;width:100%;padding:9px;border:none;border-radius:12px;cursor:pointer;
  background:var(--ink);color:#fff;font-weight:700;font-size:13px;letter-spacing:.3px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.hamrang-theme .split-btn{background:var(--hamrang-dark);}
.chorong-theme .split-btn{background:var(--chorong-pink-dark);}
.split-btn:hover{filter:brightness(1.08);}

.items-list{margin-top:10px;display:flex;flex-direction:column;gap:7px;}
.item-row{
  display:flex;align-items:center;gap:8px;background:#fbf8f2;border-radius:12px;
  padding:7px 8px 7px 12px;
}
.item-row .item-text{flex:1;font-size:13.5px;line-height:1.35;word-break:break-word;}
.item-row .item-text.done-circle{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--circle);}
.item-row .item-text.done-x{color:#c98f8a;text-decoration:line-through;text-decoration-color:var(--cross);}
.mark-btns{display:flex;gap:4px;flex:0 0 auto;}
.mark-btn{
  width:28px;height:28px;border-radius:50%;border:2px solid #e7e0d6;background:#fff;
  cursor:pointer;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;
  color:#c9c0b2;transition:.12s;
}
.mark-btn:hover{transform:scale(1.08);}
.mark-btn.circle.active{background:var(--circle);border-color:var(--circle);color:#fff;}
.mark-btn.triangle.active{background:var(--triangle);border-color:var(--triangle);color:#fff;}
.mark-btn.cross.active{background:var(--cross);border-color:var(--cross);color:#fff;}
.item-del{
  width:22px;height:22px;border-radius:50%;border:none;background:transparent;color:#ccc0af;
  cursor:pointer;font-size:14px;flex:0 0 auto;
}
.item-del:hover{color:#e2665f;}

.add-item-row{display:flex;gap:6px;margin-top:8px;}
.add-item-row input{
  flex:1;border-radius:10px;border:2px solid #f1ede3;padding:7px 10px;font-size:13px;font-family:inherit;
}
.add-item-row button{
  border:none;border-radius:10px;padding:0 14px;background:#f1ede3;color:var(--ink);font-weight:700;cursor:pointer;
}
.empty-hint{font-size:12px;color:#bcae9b;padding:6px 2px;}

.progress-bar-outer{height:8px;border-radius:999px;background:#f1ede3;overflow:hidden;margin-top:8px;}
.progress-bar-inner{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--triangle),var(--circle));transition:width .3s;}

.finish-block{margin-top:18px;border-top:2px dashed #f1ede3;padding-top:14px;}
.finish-row{display:flex;gap:10px;}
.finish-btn{
  flex:1;padding:12px;border-radius:16px;border:2px solid #eee2cf;background:#fffaf0;
  cursor:pointer;font-weight:800;font-size:14px;color:var(--ink-soft);transition:.15s;
}
.finish-btn.circle.active{background:linear-gradient(135deg,#bdeccb,var(--circle));border-color:var(--circle);color:#fff;}
.finish-btn.cross.active{background:linear-gradient(135deg,#f5c1bd,var(--cross));border-color:var(--cross);color:#fff;}

.score-row{margin-top:12px;}
.score-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.score-chip{
  width:28px;height:28px;border-radius:8px;border:2px solid #eee2cf;background:#fff;
  font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;
}
.score-chip.selected{background:var(--ink);color:#fff;border-color:var(--ink);}
.hamrang-theme .score-chip.selected{background:var(--hamrang-dark);border-color:var(--hamrang-dark);}
.chorong-theme .score-chip.selected{background:var(--chorong-pink-dark);border-color:var(--chorong-pink-dark);}

textarea.comment-input{
  width:100%;margin-top:8px;min-height:44px;border-radius:12px;border:2px solid #f1ede3;
  padding:8px 10px;font-size:13px;font-family:inherit;resize:vertical;background:#fffdf8;
}

.celebrate{
  margin-top:14px;display:flex;align-items:center;gap:10px;background:#fff7e0;border-radius:16px;
  padding:10px 12px;animation:pop .35s ease;
}
.celebrate.sad{background:#fdeceb;}
.celebrate svg{width:44px;height:44px;flex:0 0 auto;}
.celebrate .bubble{font-size:13px;font-weight:700;}
@keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ---------- Floating Encyclopedia Button ---------- */
.fab{
  position:fixed;left:18px;bottom:18px;z-index:40;
  width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--hamrang-collar),var(--chorong-pink));
  box-shadow:0 10px 22px rgba(150,110,70,.35);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  transition:transform .15s;
}
.fab:hover{transform:scale(1.07) rotate(-4deg);}
.fab-label{
  position:fixed;left:90px;bottom:34px;z-index:40;background:#fff;color:var(--ink);
  font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;
}
.fab:hover + .fab-label{opacity:1;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(70,50,30,.35);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:#fffdf8;border-radius:24px;max-width:760px;width:100%;max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;
}
.modal-head{
  display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:2px solid #f4efe4;
}
.modal-head h2{margin:0;font-size:18px;flex:1;}
.modal-close{border:none;background:#f1ede3;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink);}
.modal-search{padding:10px 18px 0;}
.modal-search input{
  width:100%;border:2px solid #f1ede3;border-radius:12px;padding:9px 12px;font-size:13.5px;font-family:inherit;
}
.modal-tabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px;}
.modal-tab{
  border:2px solid #f1ede3;background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;
  font-weight:700;color:var(--ink-soft);cursor:pointer;
}
.modal-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.modal-body{overflow-y:auto;padding:0 18px 18px;flex:1;}
.ex-card{
  background:#fff;border:2px solid #f4efe4;border-radius:16px;padding:12px 14px;margin-bottom:10px;
}
.ex-card .ex-title{font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ex-tag{
  font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#f1ede3;color:var(--ink-soft);
}
.ex-tag.equip{background:#e7f0e0;color:#4c7a3d;}
.ex-card ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-soft);line-height:1.55;}

.toast{
  position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:8px 16px;
  border-radius:999px;font-size:12.5px;font-weight:700;opacity:0;transform:translateY(8px);
  transition:.25s;pointer-events:none;z-index:200;
}
.toast.show{opacity:1;transform:translateY(0);}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:#e7d9c2;border-radius:999px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="app-header">
    <span id="headerMascotL" class="mascot-mini"></span>
    <h1>승규 <span class="heart">❤</span> 수진 운동일지</h1>
    <span id="headerMascotR" class="mascot-mini"></span>
  </div>
  <div class="app-sub">1단계 러닝·헬스 선택 → 2단계 오늘의 운동 적기 → 3단계 하나씩 체크하기 🐹</div>
  <button class="identity-chip" id="identityChip">나는 누구예요?</button>

  <div class="week-nav">
    <button id="prevWeek">‹</button>
    <div class="label" id="weekLabel">-</div>
    <button id="nextWeek">›</button>
  </div>
  <div class="today-wrap">
    <button class="today-btn" id="gotoYesterday">어제로 이동</button>
    <button class="today-btn" id="gotoToday">오늘로 이동</button>
  </div>

  <div class="day-tabs" id="dayTabs"></div>

  <div class="cards" id="cards"></div>
</div>

<button class="fab" id="fabBtn" title="운동 사전">🏋️</button>
<div class="fab-label" id="fabLabel">헬스 운동 사전 보기</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-head">
      <span style="font-size:22px;">📖</span>
      <h2>헬스 운동 사전</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-search"><input id="exSearch" placeholder="운동 이름으로 검색... (예: 벤치프레스)"></div>
    <div class="modal-tabs" id="modalTabs"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="modal-overlay" id="identityOverlay">
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-head">
      <span style="font-size:22px;">🐹</span>
      <h2>당신은 누구인가요?</h2>
      <button class="modal-close" id="identityClose">✕</button>
    </div>
    <div class="identity-pick-row">
      <button class="identity-pick-btn" id="pickSeunggyu">
        <span id="pickSeunggyuAvatar"></span>
        <div class="ipb-name">승규예요</div>
      </button>
      <button class="identity-pick-btn" id="pickSujin">
        <span id="pickSujinAvatar"></span>
        <div class="ipb-name">수진이예요</div>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast">저장됐어요 🐾</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   MASCOT SVG (햄랑이 / 초롱이 스타일 커스텀 캐릭터)
============================================================ */
function mascotSVG(kind, mood){
  mood = mood || 'normal';
  const isHam = kind === 'hamrang';
  const body   = isHam ? '#eccb98' : '#fffdf9';
  const bodyLn = isHam ? '#c9a46b' : '#e9e1d3';
  const belly  = '#fff6e6';
  const cheek  = '#ffb3ac';
  const garment= isHam ? '#ffd35c' : '#ffb3c7';
  const garmentLn = isHam ? '#f3b62e' : '#ff8aa8';

  let eyes, mouth;
  if(mood === 'happy'){
    eyes = `<path d="M48 74 Q54 66 60 74" stroke="#4a3626" stroke-width="3.4" fill="none" stroke-linecap="round"/>
            <path d="M80 74 Q86 66 92 74" stroke="#4a3626" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
    mouth = `<ellipse cx="70" cy="88" rx="7" ry="6" fill="#c9645a"/>`;
  } else if(mood === 'sad'){
    eyes = `<path d="M48 72 Q54 78 60 72" stroke="#4a3626" stroke-width="3.4" fill="none" stroke-linecap="round"/>
            <path d="M80 72 Q86 78 92 72" stroke="#4a3626" stroke-width="3.4" fill="none" stroke-linecap="round"/>
            <path d="M50 84 Q52 96 47 100" stroke="#a9d4f5" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M63 90 Q70 85 77 90" stroke="#4a3626" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  } else {
    eyes = `<circle cx="54" cy="75" r="4.2" fill="#3a2a1c"/><circle cx="86" cy="75" r="4.2" fill="#3a2a1c"/>`;
    mouth = `<path d="M64 88 Q70 93 76 88" stroke="#4a3626" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  }

  const bow = !isHam ? `
    <g transform="translate(70,26)">
      <path d="M0 0 L-16 -10 L-14 4 Z" fill="${garment}" stroke="${garmentLn}" stroke-width="2"/>
      <path d="M0 0 L16 -10 L14 4 Z" fill="${garment}" stroke="${garmentLn}" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="${garmentLn}"/>
    </g>` : '';

  return `

function isTypingInCards(){
  const ae = document.activeElement;
  if(!ae || !ae.closest) return false;
  return (ae.tagName==='TEXTAREA'||ae.tagName==='INPUT') && !!ae.closest('#cards');
}

function initFirebaseSync(){
  if(!fbReady) return;
  fbDb.ref(FB_ROOT).once('value').then(snap=>{
    const remote = snap.val();
    if(!remote && store.weeks && Object.keys(store.weeks).length){
      fbDb.ref(FB_ROOT).set(store.weeks);

    fbDb.ref(FB_ROOT).on('value', s=>{
      store.weeks = s.val() || {};

      renderDayTabs();
      if(!isTypingInCards()) renderCards();
    });
  }).catch(e=> console.warn('Firebase 동기화 오류', e));
}

/* week helpers: week starts Sunday */
function getSunday(d){
  const nd = new Date(d);
  nd.setHours(0,0,0,0);
  nd.setDate(nd.getDate() - nd.getDay());
  return nd;
}
function fmtKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtShort(d){
  return (d.getMonth()+1)+'.'+d.getDate();
}
let weekOffset = 0;
function currentWeekStart(){
  const base = getSunday(new Date());
  base.setDate(base.getDate() + weekOffset*7);
  return base;
}
function currentWeekKey(){ return fmtKey(currentWeekStart()); }

function ensureDayUser(weekKey, dayIdx, userId){
  if(!store.weeks[weekKey]) store.weeks[weekKey] = {};
  if(!store.weeks[weekKey][dayIdx]) store.weeks[weekKey][dayIdx] = {};
  if(!store.weeks[weekKey][dayIdx][userId]){
    store.weeks[weekKey][dayIdx][userId] = {
      type:null, plan:'', items:[], result:null, score:null, comment:'', comments:[]
    };
  }
  return store.weeks[weekKey][dayIdx][userId];
}

/* ============================================================
   RENDER: WEEK NAV / DAY TABS
============================================================ */
function renderWeekNav(){
  const start = currentWeekStart();
  const end = new Date(start); end.setDate(end.getDate()+6);
  const tag = weekOffset===0 ? '이번주' : (weekOffset>0 ? weekOffset+'주 후' : Math.abs(weekOffset)+'주 전');
  document.getElementById('weekLabel').textContent =
    start.getFullYear()+'.'+fmtShort(start)+' ~ '+fmtShort(end)+' ('+tag+')';
}

function dayCompletionStates(dayIdx){
  const wk = currentWeekKey();
  const dayData = (store.weeks[wk]||{})[dayIdx] || {};
  return USERS.map(u=>{
    const ud = dayData[u.id];
    if(!ud) return 'none';
    if(ud.result==='circle') return 'done-circle';
    if(ud.result==='x') return 'done-x';
    if(ud.type || (ud.items&&ud.items.length)) return 'progress';
    return 'none';
  });
}

function renderDayTabs(){
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = '';
  const start = currentWeekStart();
  DAYS.forEach((d,idx)=>{
    const date = new Date(start); date.setDate(date.getDate()+idx);
    const el = document.createElement('div');
    el.className = 'day-tab'+(idx===selectedDayIdx?' active':'')+(idx===0?' sun':(idx===6?' sat':''));
    const states = dayCompletionStates(idx);
    el.innerHTML = `<div class="dname">${d}</div>
      <div class="dsub">${fmtShort(date)}</div>
      <div class="dots">${states.map(s=>`<span class="dot ${s!=='none'?s:''}"></span>`).join('')}</div>`;
    el.onclick = ()=>{ selectedDayIdx = idx; renderDayTabs(); renderCards(); };
    wrap.appendChild(el);
  });
}

/* ============================================================
   RENDER: USER CARDS
============================================================ */
function renderCards(){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  const wk = currentWeekKey();
  USERS.forEach(u=>{
    const ud = ensureDayUser(wk, selectedDayIdx, u.id);
    wrap.appendChild(buildCard(u, ud));
  });
}

function progressPercent(items){
  if(!items.length) return 0;
  let sum = 0;
  items.forEach(it=>{
    if(it.status==='circle') sum += 1;
    else if(it.status==='triangle') sum += 0.5;
  });
  return Math.round(sum/items.length*100);
}

function buildCard(u, ud){
  const myId = getMyIdentity();
  const isMine = myId === u.id;

  const card = document.createElement('div');
  card.className = 'card '+u.theme+(isMine?'':' readonly-card');

  const head = document.createElement('div');
  head.className = 'card-head';
  const avatarWrap = document.createElement('div');
  avatarWrap.className = 'mascot-avatar';
  avatarWrap.innerHTML = mascotSVG(u.mascot, ud.result==='circle'?'happy':(ud.result==='x'?'sad':'normal'));
  head.appendChild(avatarWrap);
  const who = document.createElement('div');
  who.className = 'who';
  who.innerHTML = `<div class="name">${u.name}${isMine?'':'<span class="view-badge">보기 전용 · 댓글 가능</span>'}</div>` +
    (ud.type? `<span class="badge">${ud.type==='running'?'🏃 러닝':'🏋️ 헬스'}</span>`:'');
  head.appendChild(who);
  const pr = document.createElement('div');
  pr.className = 'progress-ring';
  pr.textContent = ud.items.length ? progressPercent(ud.items)+'%' : '';
  head.appendChild(pr);
  card.appendChild(head);

  /* STEP 1 */
  const step1 = document.createElement('div');
  step1.className = 'step';
  step1.innerHTML = `<div class="step-label">STEP 1 · 운동 종류 선택</div>`;
  const toggle = document.createElement('div');
  toggle.className = 'type-toggle';
  ['running','gym'].forEach(t=>{
    const b = document.createElement('button');
    b.className = 'type-btn'+(ud.type===t?' selected':'');
    b.textContent = t==='running' ? '🏃 러닝' : '🏋️ 헬스';
    b.disabled = !isMine;
    b.onclick = ()=>{ ud.type = (ud.type===t? null : t); commit(u.id); renderCards(); renderDayTabs(); };
    toggle.appendChild(b);
  });
  step1.appendChild(toggle);
  card.appendChild(step1);

  /* STEP 2 */
  const step2 = document.createElement('div');
  step2.className = 'step';
  step2.innerHTML = `<div class="step-label">STEP 2 · 오늘 운동 상세히 적기</div>`;
  const ta = document.createElement('textarea');
  ta.className = 'plan-input';
  ta.placeholder = '한 줄에 하나씩 적어주세요\n예)\n벤치프레스 3세트\n인클라인 덤벨프레스 3세트\n케이블크로스오버 3세트';
  ta.value = ud.plan || '';
  ta.readOnly = !isMine;
  ta.oninput = ()=>{ ud.plan = ta.value; scheduleSave(u.id); };
  ta.onblur = ()=> setTimeout(renderCards, 0);
  step2.appendChild(ta);
  const splitBtn = document.createElement('button');
  splitBtn.className = 'split-btn';
  splitBtn.innerHTML = '⬇ 하나씩 쪼개서 체크리스트 만들기';
  splitBtn.disabled = !isMine;
  splitBtn.onclick = ()=>{
    const lines = (ud.plan||'').split('\n').map(s=>s.trim()).filter(Boolean);
    const prevMap = {};
    ud.items.forEach(it=>{ if(!prevMap[it.text]) prevMap[it.text]=it.status; });
    ud.items = lines.map(text=>({
      id: text+'_'+Math.random().toString(36).slice(2,8),
      text,
      status: prevMap[text] || null
    }));
    commit(u.id); renderCards(); renderDayTabs();
  };
  step2.appendChild(splitBtn);
  card.appendChild(step2);

  /* STEP 3 */
  const step3 = document.createElement('div');
  step3.className = 'step';
  step3.innerHTML = `<div class="step-label">STEP 3 · 하나씩 체크 (○ 완료 · △ 부분 · ✕ 실패)</div>`;
  const list = document.createElement('div');
  list.className = 'items-list';
  if(!ud.items.length){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '2단계를 적고 "쪼개기" 버튼을 눌러보세요 🐹';
    list.appendChild(hint);
  }
  ud.items.forEach((it,i)=>{
    const row = document.createElement('div');
    row.className = 'item-row';
    const txt = document.createElement('div');
    txt.className = 'item-text'+(it.status==='circle'?' done-circle':(it.status==='x'?' done-x':''));
    txt.textContent = it.text;
    row.appendChild(txt);
    const marks = document.createElement('div');
    marks.className = 'mark-btns';
    [['circle','○'],['triangle','△'],['cross','✕']].forEach(([key,sym])=>{
      const statusKey = key==='cross' ? 'x' : key;
      const mb = document.createElement('button');
      mb.className = 'mark-btn '+key+(it.status===statusKey?' active':'');
      mb.textContent = sym;
      mb.disabled = !isMine;
      mb.onclick = ()=>{
        it.status = (it.status===statusKey) ? null : statusKey;
        commit(u.id); renderCards(); renderDayTabs();
      };
      marks.appendChild(mb);
    });
    row.appendChild(marks);
    const del = document.createElement('button');
    del.className = 'item-del';
    del.textContent = '×';
    del.disabled = !isMine;
    del.onclick = ()=>{ ud.items.splice(i,1); commit(u.id); renderCards(); renderDayTabs(); };
    row.appendChild(del);
    list.appendChild(row);
  });
  step3.appendChild(list);

  if(ud.items.length){
    const barOuter = document.createElement('div');
    barOuter.className = 'progress-bar-outer';
    const barInner = document.createElement('div');
    barInner.className = 'progress-bar-inner';
    barInner.style.width = progressPercent(ud.items)+'%';
    barOuter.appendChild(barInner);
    step3.appendChild(barOuter);
  }

  const addRow = document.createElement('div');
  addRow.className = 'add-item-row';
  const addInput = document.createElement('input');
  addInput.placeholder = '항목 직접 추가...';
  addInput.disabled = !isMine;
  const addBtn = document.createElement('button');
  addBtn.textContent = '+ 추가';
  addBtn.disabled = !isMine;
  const doAdd = ()=>{
    const v = addInput.value.trim();
    if(!v) return;
    ud.items.push({ id:v+'_'+Math.random().toString(36).slice(2,8), text:v, status:null });
    addInput.value = '';
    commit(u.id); renderCards(); renderDayTabs();
  };
  addBtn.onclick = doAdd;
  addInput.onkeydown = (e)=>{ if(e.key==='Enter') doAdd(); };
  addRow.appendChild(addInput); addRow.appendChild(addBtn);
  step3.appendChild(addRow);

  card.appendChild(step3);

  /* FINISH */
  const finish = document.createElement('div');
  finish.className = 'finish-block';
  finish.innerHTML = `<div class="step-label">STEP 4 · 오늘 운동 마무리</div>`;
  const frow = document.createElement('div');
  frow.className = 'finish-row';
  [['circle','○ 완료했어요'],['x','✕ 못했어요']].forEach(([key,label])=>{
    const b = document.createElement('button');
    b.className = 'finish-btn '+key+(ud.result===key?' active':'');
    b.textContent = label;
    b.disabled = !isMine;
    b.onclick = ()=>{ ud.result = (ud.result===key? null : key); commit(u.id); renderCards(); renderDayTabs(); };
    frow.appendChild(b);
  });
  finish.appendChild(frow);

  const scoreRow = document.createElement('div');
  scoreRow.className = 'score-row';
  scoreRow.innerHTML = `<div class="step-label" style="margin-top:12px;">오늘의 운동 점수</div>`;
  const chips = document.createElement('div');
  chips.className = 'score-chips';
  for(let n=1;n<=10;n++){
    const c = document.createElement('button');
    c.className = 'score-chip'+(ud.score===n?' selected':'');
    c.textContent = n;
    c.disabled = !isMine;
    c.onclick = ()=>{ ud.score = (ud.score===n? null : n); commit(u.id); renderCards(); };
    chips.appendChild(c);
  }
  scoreRow.appendChild(chips);
  const commentTa = document.createElement('textarea');
  commentTa.className = 'comment-input';
  commentTa.placeholder = '오늘 운동 한줄평을 남겨보세요 ✍';
  commentTa.value = ud.comment || '';
  commentTa.readOnly = !isMine;
  commentTa.oninput = ()=>{ ud.comment = commentTa.value; scheduleSave(u.id); };
  commentTa.onblur = ()=> setTimeout(renderCards, 0);
  scoreRow.appendChild(commentTa);
  finish.appendChild(scoreRow);

  if(ud.result){
    const cel = document.createElement('div');
    cel.className = 'celebrate'+(ud.result==='x'?' sad':'');
    cel.innerHTML = `${mascotSVG(u.mascot, ud.result==='circle'?'happy':'sad')}
      <div class="bubble">${ud.result==='circle' ? (u.name+'! 오늘도 잘했어요 🎉') : (u.name+'~ 다음엔 화이팅! 💪')}</div>`;
    finish.appendChild(cel);
  }

  card.appendChild(finish);

  /* COMMENTS — 서로 코멘트를 남길 수 있는 공간 (양쪽 카드 모두 가능) */
  const commentsBlock = document.createElement('div');
  commentsBlock.className = 'comments-block';
  commentsBlock.innerHTML = `<div class="step-label">💬 댓글</div>`;
  const cList = document.createElement('div');
  (ud.comments||[]).forEach(c=>{
    const item = document.createElement('div');
    item.className = 'comment-item';
    const authorName = (USERS.find(x=>x.id===c.author)||{}).name || c.author;
    const t = new Date(c.ts);
    const timeStr = (t.getMonth()+1)+'.'+t.getDate()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    item.innerHTML = `<span class="c-author">${escapeHtml(authorName)}</span>${escapeHtml(c.text)}<span class="c-time">${timeStr}</span>`;
    cList.appendChild(item);
  });
  if(!ud.comments || !ud.comments.length){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '아직 댓글이 없어요. 한마디 남겨보세요!';
    cList.appendChild(hint);
  }
  commentsBlock.appendChild(cList);

  const addC = document.createElement('div');
  addC.className = 'comment-add-row';
  const cInput = document.createElement('input');
  cInput.placeholder = myId ? '댓글 남기기...' : '먼저 위에서 "나는 누구?"를 선택해주세요';
  cInput.disabled = !myId;
  const cBtn = document.createElement('button');
  cBtn.textContent = '등록';
  cBtn.disabled = !myId;
  const doAddComment = ()=>{
    const v = cInput.value.trim();
    if(!v || !myId) return;
    ud.comments = ud.comments || [];
    ud.comments.push({ id: Date.now()+'_'+Math.random().toString(36).slice(2,6), author: myId, text: v, ts: Date.now() });
    cInput.value = '';
    commit(u.id); renderCards();
  };
  cBtn.onclick = doAddComment;
  cInput.onkeydown = (e)=>{ if(e.key==='Enter') doAddComment(); };
  addC.appendChild(cInput); addC.appendChild(cBtn);
  commentsBlock.appendChild(addC);
  card.appendChild(commentsBlock);

  return card;
}

const saveTimers = {};
function scheduleSave(uid){
  clearTimeout(saveTimers[uid]);
  saveTimers[uid] = setTimeout(()=>{ commit(uid); renderDayTabs(); }, 500);
}

/* ============================================================
   ENCYCLOPEDIA MODAL
============================================================ */
let activeCat = '가슴';
function renderModalTabs(){
  const wrap = document.getElementById('modalTabs');
  wrap.innerHTML = '';
  Object.keys(EXERCISES).forEach(cat=>{
    const b = document.createElement('button');
    b.className = 'modal-tab'+(cat===activeCat?' active':'');
    b.textContent = cat;
    b.onclick = ()=>{ activeCat = cat; document.getElementById('exSearch').value=''; renderModalTabs(); renderModalBody(); };
    wrap.appendChild(b);
  });
}
function renderModalBody(query){
  const body = document.getElementById('modalBody');
  body.innerHTML = '';
  let list;
  if(query){
    list = [];
    Object.entries(EXERCISES).forEach(([cat,arr])=>{
      arr.forEach(ex=>{ if(ex.name.includes(query)) list.push(ex); });
    });
  } else {
    list = EXERCISES[activeCat];
  }
  if(!list.length){
    body.innerHTML = '<div class="empty-hint">검색 결과가 없어요 🐹</div>';
    return;
  }
  list.forEach(ex=>{
    const card = document.createElement('div');
    card.className = 'ex-card';
    card.innerHTML = `
      <div class="ex-title">🐾 ${ex.name}
        <span class="ex-tag equip">${ex.equip}</span>
        <span class="ex-tag">${ex.target}</span>
      </div>
      <ul>${ex.tips.map(t=>`<li>${t}</li>`).join('')}</ul>
    `;
    body.appendChild(card);
  });
}

const modalOverlay = document.getElementById('modalOverlay');
document.getElementById('fabBtn').onclick = ()=>{
  modalOverlay.classList.add('open');
  renderModalTabs(); renderModalBody();
};
document.getElementById('modalClose').onclick = ()=> modalOverlay.classList.remove('open');
modalOverlay.onclick = (e)=>{ if(e.target===modalOverlay) modalOverlay.classList.remove('open'); };
document.getElementById('exSearch').oninput = (e)=> renderModalBody(e.target.value.trim());

/* ============================================================
   WEEK NAV EVENTS
============================================================ */
function gotoDate(date){
  const targetSunday = getSunday(date);
  const thisSunday = getSunday(new Date());
  weekOffset = Math.round((targetSunday - thisSunday) / (7*24*3600*1000));
  selectedDayIdx = date.getDay();
  renderWeekNav(); renderDayTabs(); renderCards();
}
document.getElementById('prevWeek').onclick = ()=>{ weekOffset--; renderWeekNav(); renderDayTabs(); renderCards(); };
document.getElementById('nextWeek').onclick = ()=>{ weekOffset++; renderWeekNav(); renderDayTabs(); renderCards(); };
document.getElementById('gotoToday').onclick = ()=> gotoDate(new Date());
document.getElementById('gotoYesterday').onclick = ()=> gotoDate(new Date(Date.now()-86400000));

/* ============================================================
   IDENTITY PICKER WIRING
============================================================ */
document.getElementById('identityChip').onclick = ()=> document.getElementById('identityOverlay').classList.add('open');
document.getElementById('identityClose').onclick = ()=> document.getElementById('identityOverlay').classList.remove('open');
document.getElementById('identityOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='identityOverlay') e.currentTarget.classList.remove('open');
});
document.getElementById('pickSeunggyuAvatar').innerHTML = mascotSVG('hamrang','happy');
document.getElementById('pickSujinAvatar').innerHTML = mascotSVG('chorong','happy');
document.getElementById('pickSeunggyu').onclick = ()=> setMyIdentity('seunggyu');
document.getElementById('pickSujin').onclick = ()=> setMyIdentity('sujin');

/* ============================================================
   INIT
============================================================ */
updateIdentityChip();
if(!getMyIdentity()) document.getElementById('identityOverlay').classList.add('open');
renderWeekNav();
renderDayTabs();
renderCards();
initFirebaseSync();

})();
